<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flinder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="header-index">
      <h1 class="site-title">
        <a href="index.html">
          <!-- <img
            id="flinder-logo"
            src="assets/images/flinder-bgdark.png"
            alt="Flinder logo"
          /> -->
        </a>
      </h1>

      <!-- <nav>
        <a href="/app.html">Swipe</a>
        <a href="/categories.html">Categories</a>
        <div id="auth-state"></div>
      </nav> -->
    </header>
    <main>
      <div id="hero">
        <img src="assets/images/test2.png" alt="Flinder cute" />
      </div>
      <button id="cta-main">Match movies!</button>

      <!-- <div class="hero-logo"></div> -->

      <div id="h2-cont">
        <h2>
          The greatest flix finder on earth<span id="index-tiny">
            probably</span
          >
        </h2>
      </div>
      <form id="login-form">
        <input
          type="email"
          id="login-email"
          placeholder="Username"
          autocomplete="email"
          required
        />
        <input
          type="password"
          id="login-password"
          placeholder="Password"
          autocomplete="current-password"
          required
          minlength="6"
        />
        <menu>
          <button id="login-index" type="submit">Login</button>
        </menu>
      </form>
      <div class="signup-cont">
        <p>Don't have an account?</p>
        <button id="signup-index">Sign up!</button>
      </div>
    </main>
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
