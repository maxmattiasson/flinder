<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flinder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1><a href="index.html">Flinder</a></h1>
      <nav>
        <a href="/app.html">Swipe</a>
        <a href="/categories.html">Categories</a>
        <a href="/about.html">About</a>
      </nav>
    </header>
    <main>
      <div id="temp-cont">
        <div id="title-cont">
          <h2 id="temp-title">Title</h2>
          <p id="temp-year">1966</p>
        </div>
        <img id="temp-img" />
        <div id="temp-short-desc">
          Chasing dinosaurs in the middle of the jungle
        </div>
        <div id="temp-tiny-desc">
          <div id="temp-genre">Action</div>
          <div id="temp-actors">Bruce Dallas</div>
        </div>
        <div id="info-cont">
          <div id="temp-rating">7/10</div>
          <div id="temp-type">Movie <span id="temp-length">2h 30min</span></div>
          <div id="temp-stream">Netflix</div>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
