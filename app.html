<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flinder</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Rubik+Doodle+Shadow&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav>
        <a id="library-nav" href="/library.html">Library</a>
        <div id="auth-state"></div>
      </nav>
    </header>
    <main>
      <div id="match-toast">Match on the big banger with bingberngar</div>
      <div id="movie-cont"></div>
      <div id="movie-modal" class="modal hidden">
        <iframe id="modal-trailer" allowfullscreen></iframe>
        <div id="modal-runtime"></div>
        <div id="modal-title"></div>
        <div id="modal-rating-cont">
          <div id="modal-rating"></div>
          <div id="modal-vote-count"></div>
        </div>

        <div id="modal-desc"></div>
        <div id="modal-genres"></div>

        <div id="modal-stream"></div>
        <div class="modal-actions">
          <button id="modal-no">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path
                d="M6 6L18 18M6 18L18 6"
                stroke="currentColor"
                stroke-width="4"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button id="modal-yes">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                d="M2 9.1371C2 14 6.01943 16.5914 8.96173 18.9109C10 19.7294 11 20.5 12 20.5C13 20.5 14 19.7294 15.0383 18.9109C17.9806 16.5914 22 14 22 9.1371C22 4.27416 16.4998 0.825464 12 5.50063C7.50016 0.825464 2 4.27416 2 9.1371Z"
                fill="currentColor"
              />
            </svg>
          </button>
        </div>
        <button id="close-modal-btn">✖</button>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
