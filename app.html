<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flinder</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Rubik+Doodle+Shadow&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav>
        <a href="/profile.html" id="auth-state"></a>
      </nav>
    </header>
    <main>
      <div id="match-toast"></div>
      <div id="movie-cont"></div>
      <div id="movie-modal" class="modal hidden">
        <div id="modal-title"><span id="modal-year"></span></div>
        <iframe id="modal-trailer" allowfullscreen></iframe>
        <img id="modal-poster" />
        <div id="modal-desc"></div>
        <div id="modal-genres"></div>
        <div id="modal-actors"></div>
        <div id="modal-runtime"></div>
        <div id="modal-stream"></div>
        <div id="modal-rating"></div>
        <div id="modal-tagline"></div>
        <div id="modal-vote-count"></div>
        <img id="modal-backdrop" />
        <button id="close-modal-btn">✖</button>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
