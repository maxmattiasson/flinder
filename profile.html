<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flinder</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1><a href="index.html">Flinder</a></h1>
      <nav>
        <a href="/app.html">Swipe</a>
        <a href="/profile.html" id="auth-state"></a>
      </nav>
    </header>
    <main>
      <section class="social-page">
        <h2>Profile</h2>
        <div class="profile-cont">
          <div id="display-name-cont">
            <p id="display-name"></p>
            <button id="edit-name-btn">Change</button>
          </div>
          <dialog id="change-name">
            <form id="change-name-form">
              <label for="input-display-name"></label>
              <input
                id="input-display-name"
                type="text"
                maxlength="12"
                minlength="2"
                placeholder="New name"
              />
              <p id="name-change-info"></p>
              <div>
                <button id="submit-name" type="submit">Save</button>
                <button id="cancel-name" type="button">Cancel</button>
              </div>
            </form>
          </dialog>
        </div>

        <div class="friendslist-cont">
          <div id="friends-list"></div>
          <form id="add-cont">
            <label for="add-input"></label>
            <input
              id="add-input"
              name="add"
              type="text"
              maxlength="4"
              minlength="4"
              placeholder="Add a friend"
            />
            <button type="submit" id="add-btn">+</button>
          </form>
          <p id="add-info"></p>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
