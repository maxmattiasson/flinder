<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flinder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form id="signup-form">
      <h3>Sign up</h3>
      <input
        type="email"
        id="signup-email"
        autocomplete="email"
        placeholder="Email"
        required
      />
      <input
        type="password"
        id="signup-password"
        placeholder="Password"
        minlength="6"
        autocomplete="new-password"
        required
      />
      <input
        type="password"
        id="signup-repeat"
        placeholder="Repeat password"
        minlength="6"
        autocomplete="new-password"
        required
      />

      <menu>
        <button type="submit" id="signup-register">Register</button>
        <button type="button" id="close-signup">Go back</button>
      </menu>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
